<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQNet Wi-Fi DTN Node</title>
  <style>
    body { background: #0b132b; color: #fff; font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .card { background: #1c2541; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #48cae4; }
    input, select, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 12px; background: #0b132b; color: #fff; border: 1px solid #48cae4; border-radius: 4px; box-sizing: border-box; }
    button { background: #00b4d8; font-weight: bold; cursor: pointer; }
    button:hover { background: #90e0ef; color: #0b132b; }
    .log { background: #050814; padding: 10px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 13px; border-radius: 4px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
    .stat-box { background: #0b132b; padding: 8px; border-radius: 4px; border: 1px solid #3a86ff; text-align: center; }
    .badge-critical { background: #d90429; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; }
    .badge-urgent { background: #fb8500; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; color: #000; }
    .badge-routine { background: #2ec4b6; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; color: #000; }
  </style>
</head>
<body>

  <!-- Analytics Dashboard Panel -->
  <div class="card">
    <h3>📊 Network Analytics Dashboard</h3>
    <div class="stats-grid">
      <div class="stat-box">Active Nodes: <span id="statNodes">0</span></div>
      <div class="stat-box">Buffered Bundles: <span id="statBuffered">0</span></div>
      <div class="stat-box">Total Dispatched: <span id="statDispatched">0</span></div>
      <div class="stat-box">Total Delivered: <span id="statDelivered">0</span></div>
    </div>
  </div>

  <div class="card">
    <h2>ResQNet Physical Wi-Fi DTN Node</h2>
    <label>Your Node Name:</label>
    <input type="text" id="nodeName" value="Node-Phone-1" />
    <button onclick="register()">Join Local Network</button>
  </div>

  <div class="card">
    <h3>Dispatch Emergency Bundle</h3>
    <label>Destination Node Name:</label>
    <input type="text" id="targetNode" placeholder="e.g. Node-Laptop-HQ" />
    <label>Priority Level:</label>
    <select id="priority">
      <option value="Critical">🔴 Critical (Medical / Life Support)</option>
      <option value="Urgent">🟠 Urgent (Food / Water Supply)</option>
      <option value="Routine" selected>🟢 Routine (General Status)</option>
    </select>
    <label>Payload Message:</label>
    <input type="text" id="payload" placeholder="Medical supplies needed at sector 4" />
    <button onclick="sendBundle()">Send Bundle (Store & Forward)</button>
  </div>

  <div class="card">
    <h3>Live Message Log</h3>
    <div id="log" class="log"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    function logMessage(text) {
      const box = document.getElementById('log');
      box.innerHTML += `<div>> ${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function register() {
      const name = document.getElementById('nodeName').value;
      socket.emit('register-node', name);
      logMessage(`Registered on local network as: ${name}`);
    }

    function sendBundle() {
      const from = document.getElementById('nodeName').value;
      const to = document.getElementById('targetNode').value;
      const priority = document.getElementById('priority').value;
      const payload = document.getElementById('payload').value;
      
      socket.emit('send-bundle', { from, to, priority, payload, time: new Date().toLocaleTimeString() });
      logMessage(`Dispatched [${priority}] bundle to ${to}`);
    }

    socket.on('receive-bundle', (bundle) => {
      let badgeClass = 'badge-routine';
      if (bundle.priority === 'Critical') badgeClass = 'badge-critical';
      if (bundle.priority === 'Urgent') badgeClass = 'badge-urgent';

      logMessage(`📦 <span class="${badgeClass}">[${bundle.priority}]</span> From ${bundle.from}: "${bundle.payload}"`);
    });

    socket.on('buffer-status', (data) => {
      logMessage(`⚠️ [Store-Carry-Forward Active] Destination offline. Server holding bundle.`);
    });

    // Listen for analytics stats updates from the server
    socket.on('update-stats', (stats) => {
      document.getElementById('statNodes').innerText = stats.activeNodes;
      document.getElementById('statBuffered').innerText = stats.bufferedCount;
      document.getElementById('statDispatched').innerText = stats.totalDispatched;
      document.getElementById('statDelivered').innerText = stats.totalDelivered;
    });
  </script>
</body>
</html>
